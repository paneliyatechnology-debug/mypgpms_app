
name: MYPGPMS Play Store Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mypgpms-playstore-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Restore Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks

      - name: Create Key Properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties

      - name: Generate Automatic Version Code
        env:
          VERSION_BASE: ${{ vars.VERSION_CODE_BASE }}
        run: |
          VERSION_CODE=$((VERSION_BASE + (GITHUB_RUN_NUMBER - 1) * 100 + GITHUB_RUN_ATTEMPT))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "New Version Code: $VERSION_CODE"

      - name: Build Release AAB
        run: |
          flutter build appbundle --release \
            --build-number="$VERSION_CODE"

      - name: Save AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MYPGPMS-${{ env.VERSION_CODE }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

      - name: Deploy to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON }}
          packageName: ${{ vars.ANDROID_PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: production
          status: completed
          changesNotSentForReview: false
